services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - localstack
    environment:
      DATABASE_URL: postgresql+asyncpg://fridgefriend:fridgefriend@postgres:5432/fridgefriend
      REDIS_URL: redis://redis:6379/0
      AUTH_MOCK: "false"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: fridgefriend-uploads
      AWS_REGION: us-east-1
      # Required in production: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SENTRY_DSN, AMPLITUDE_API_KEY
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORAGE_BACKEND: s3
      PHOTO_PARSER_BACKEND: "${PHOTO_PARSER_BACKEND:-llm}"
      LLM_API_URL: "${LLM_API_URL:-https://litellm.labs.jb.gg}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4.1-mini}"
      SENTRY_DSN: ""
      AMPLITUDE_API_KEY: ""

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    depends_on:
      - backend
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://fridgefriend:fridgefriend@postgres:5432/fridgefriend
      REDIS_URL: redis://redis:6379/0

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    depends_on:
      - backend
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://fridgefriend:fridgefriend@postgres:5432/fridgefriend
      REDIS_URL: redis://redis:6379/0

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fridgefriend
      POSTGRES_PASSWORD: fridgefriend
      POSTGRES_DB: fridgefriend
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata_prod:
