services:
  backend:
    image: ${ECR_REGISTRY}/fridgefriend-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  celery-worker:
    image: ${ECR_REGISTRY}/fridgefriend-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=4
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  celery-beat:
    image: ${ECR_REGISTRY}/fridgefriend-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  dashboard:
    image: ${ECR_REGISTRY}/fridgefriend-dashboard:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
