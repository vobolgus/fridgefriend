name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 490346182218.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_ECR_REPO: fridgefriend-backend
  DASHBOARD_ECR_REPO: fridgefriend-dashboard
  ECS_CLUSTER: fridgefriend-production-cluster

jobs:
  build-and-push:
    name: Build and push images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
      backend_image: ${{ steps.image-meta.outputs.backend_image }}
      dashboard_image: ${{ steps.image-meta.outputs.dashboard_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Compute image metadata
        id: image-meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          BACKEND_IMAGE="${ECR_REGISTRY}/${BACKEND_ECR_REPO}:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${ECR_REGISTRY}/${DASHBOARD_ECR_REPO}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dashboard_image=${DASHBOARD_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image-meta.outputs.backend_image }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:latest

      - name: Build and push dashboard image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image-meta.outputs.dashboard_image }}
            ${{ env.ECR_REGISTRY }}/${{ env.DASHBOARD_ECR_REPO }}:latest

  deploy-backend:
    name: Deploy backend to ECS
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    needs: build-and-push
    permissions:
      contents: read
    env:
      ECS_SERVICE: fridgefriend-production-backend
      TASK_FAMILY: fridgefriend-production-backend
      CONTAINER_NAME: backend

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > task-definition.json

      - name: Render backend task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.backend_image }}

      - name: Deploy backend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-worker:
    name: Deploy worker to ECS
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    needs: build-and-push
    permissions:
      contents: read
    env:
      ECS_SERVICE: fridgefriend-production-worker
      TASK_FAMILY: fridgefriend-production-worker
      CONTAINER_NAME: worker

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > task-definition.json

      - name: Render worker task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.backend_image }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-dashboard:
    name: Deploy dashboard to ECS
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    needs: build-and-push
    permissions:
      contents: read
    env:
      ECS_SERVICE: fridgefriend-production-dashboard
      TASK_FAMILY: fridgefriend-production-dashboard
      CONTAINER_NAME: dashboard

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > task-definition.json

      - name: Render dashboard task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.dashboard_image }}

      - name: Deploy dashboard service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  smoke-test:
    name: Smoke test production endpoints
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - deploy-backend
      - deploy-worker
      - deploy-dashboard
    continue-on-error: true

    steps:
      - name: Wait for services to settle
        run: sleep 30

      - name: Check API health
        run: curl -sf https://api.fridgefriend.lat/health

      - name: Check API readiness
        run: curl -sf https://api.fridgefriend.lat/health/ready
