name: Backend Tests

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fridgefriend
          POSTGRES_PASSWORD: fridgefriend
          POSTGRES_DB: fridgefriend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fridgefriend -d fridgefriend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://fridgefriend:fridgefriend@localhost:5432/fridgefriend_test
        run: python -m pytest tests/ -v --tb=short

      - name: Build backend image
        working-directory: .
        run: docker build -f backend/Dockerfile -t fridgefriend-backend:test .
