name: Backend Tests

on:
  push:
    branches: [main]
    paths: ['backend/**', 'dashboard/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'dashboard/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fridgefriend
          POSTGRES_PASSWORD: fridgefriend
          POSTGRES_DB: fridgefriend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fridgefriend -d fridgefriend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -v --tb=short

      - name: Run dashboard tests
        working-directory: .
        run: |
          pip install -r dashboard/requirements.txt
          PYTHONPATH=dashboard python -m pytest dashboard/tests/ -v --tb=short

      - name: Build backend image
        working-directory: backend
        run: docker build -t fridgefriend-backend:test .
