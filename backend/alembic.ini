# Alembic config for FridgeFriend backend.
#
# The database URL is resolved at runtime from `app.core.config.settings.DATABASE_URL`
# (see `alembic/env.py`), so the `sqlalchemy.url` value here is intentionally a
# placeholder and is NEVER used. Set `DATABASE_URL` in the environment instead.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@host/dbname

# Use UTC timestamps in generated revision filenames; format gives us an
# auditable, sortable file like 20260425_1234-<rev>_<slug>.py.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
# No autoformat hook to keep generated migrations stable across machines.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
