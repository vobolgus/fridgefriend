[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fridgefriend-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.3",
  "uvicorn[standard]==0.43.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "redis[hiredis]>=5.0.0",
  "sentry-sdk[fastapi]>=2.27.0",
]

[project.optional-dependencies]
worker = [
  "celery>=5.3.0",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "anyio==4.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
include = ["app", "tests"]
extraPaths = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
